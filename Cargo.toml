[workspace]
resolver = "2"
members = ["aoc-lib", "aoc", "benches", "registry-tool"]

[workspace.package]
version = "0.3.0"
edition = "2024"
authors = ["Advent of Code Solutions"]
rust-version = "1.92"

[workspace.dependencies]
# Required dependencies
anyhow = "1.0.100"
clap = { version = "4.5", features = ["derive", "cargo"] }
colored = "3.0.0"
criterion = { version = "0.8", features = ["html_reports"] }
reqwest = { version = "0.12", features = ["blocking", "cookies"] }

# Optional utilities (uncomment in aoc-lib/Cargo.toml as needed)
regex = "1.12.2"
ahash = "0.8.12"
atoi = "2.0.0"
itertools = "0.14.0"
once_cell = "1.21.3"
